  <text x="64" y="66" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="3" fill="#FE4E01">OVERVIEW</text>
  <text x="64" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">⚡ What I do</text>

