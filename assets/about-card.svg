  <text x="664" y="66" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="3" fill="#FE4E01">STATUS</text>
  <text x="664" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">🎯 Currently</text>

  <rect x="664" y="138" width="472" height="86" rx="14" fill="#141414" stroke="#FE4E01" stroke-width="1.5" stroke-opacity="0.55"/>
  <rect x="664" y="138" width="5" height="86" rx="2.5" fill="#FE4E01"/>
  <text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-style="italic" fill="#d8d8d8">
