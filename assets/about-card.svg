    <text x="64" y="330">🌐<tspan x="96" y="330">Build fast, modern web apps with <tspan font-weight="700" fill="#ffffff">Next.js &amp; React</tspan></tspan></text>
    <text x="64" y="376">☁️<tspan x="96" y="376">Architect and deploy on <tspan font-weight="700" fill="#ffffff">AWS, GCP &amp; Supabase</tspan></tspan></text>
    <text x="64" y="422">🗄️<tspan x="96" y="422">Design schemas &amp; real-time systems on <tspan font-weight="700" fill="#ffffff">PostgreSQL</tspan></tspan></text>
    <text x="64" y="468">🚀<tspan x="96" y="468">Ship &amp; own production systems at <tspan font-weight="700" fill="#ffffff">Astaan</tspan></tspan></text>
  </g>

