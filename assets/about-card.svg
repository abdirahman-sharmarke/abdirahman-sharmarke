<svg width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FE4E01"/>
      <stop offset="100%" stop-color="#FFB700"/>
    </linearGradient>
    <filter id="glowBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="1198" height="558" rx="31"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="558" rx="31" fill="#0a0a0a" stroke="url(#borderGrad)" stroke-width="2"/>

  <g clip-path="url(#cardClip)">
    <circle cx="1160" cy="10" r="200" fill="#FE4E01" opacity="0.12" filter="url(#glowBlur)"/>
    <circle cx="20" cy="550" r="180" fill="#FFB700" opacity="0.08" filter="url(#glowBlur)"/>
  </g>

  <line x1="600" y1="64" x2="600" y2="496" stroke="#242424" stroke-width="1"/>

