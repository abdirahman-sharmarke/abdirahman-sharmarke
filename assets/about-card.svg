    <tspan x="692" y="200">codebase, at <tspan font-weight="700" font-style="normal" fill="#ffffff">Astaan.</tspan></tspan>
  </text>

  <text x="664" y="262" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#FE4E01">CORE STACK</text>

